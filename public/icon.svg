<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0724" />
      <stop offset="100%" stop-color="#090108" />
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.3" />

  <!-- Glowing Heart -->
  <g filter="url(#glow)">
    <path d="M256 420 C256 420 80 295 80 190 C80 130 128 85 188 85 C222 85 244 105 256 120 C268 105 290 85 324 85 C384 85 432 130 432 190 C432 295 256 420 256 420 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Crown on Top -->
  <g filter="url(#glow)" transform="translate(186, 120) scale(0.7)">
    <path d="M100 10 L135 65 L175 25 L160 90 L40 90 L25 25 L65 65 Z" fill="url(#crownGrad)" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round" />
    <circle cx="25" cy="22" r="7" fill="#fff" />
    <circle cx="100" cy="8" r="8" fill="#fff" />
    <circle cx="175" cy="22" r="7" fill="#fff" />
  </g>

  <!-- Sparkles -->
  <circle cx="140" cy="160" r="4" fill="#fff" opacity="0.8" />
  <circle cx="360" cy="180" r="5" fill="#fff" opacity="0.9" />
  <circle cx="256" cy="320" r="6" fill="#fff" opacity="0.7" />
</svg>
